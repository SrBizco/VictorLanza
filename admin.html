<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editar página | Victor Lanza</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section id="login-panel" class="login-panel">
      <p class="eyebrow">VICTOR LANZA · DESDE 1987</p>
      <h1>Editar la página</h1>
      <p>Ingresá para ver y modificar la página tal como la ven tus clientes.</p>
      <form id="login-form">
        <label>Email <input id="email" type="email" autocomplete="email" required></label>
        <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Ingresar</button>
      </form>
      <p id="login-message" class="form-message" role="alert"></p>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
